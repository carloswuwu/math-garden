name: tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install build dependencies
        run: npm ci
      - name: Build dist
        run: npm run build
      - name: Verify committed dist and generated data wrappers are current
        run: |
          if [ -n "$(git status --porcelain -- dist i18n.js curriculum.js curriculum-outline.js formulas.js lessons.js math-core.js app.js)" ]; then
            echo "::error::dist/ or generated wrappers are out of date — run 'npm run build' and commit the result."
            git status --porcelain -- dist i18n.js curriculum.js curriculum-outline.js formulas.js lessons.js math-core.js app.js
            exit 1
          fi
      - name: Install test dependencies
        run: npm ci --prefix tests
      - name: Engine property tests
        run: node tests/core.test.js
      - name: UI behaviour tests
        run: node tests/ui.test.js
      - name: Generator / content contract tests
        run: node tests/generators.test.js
      - name: Cross-layer contract tests (MATH_SPEC, assets, i18n, solvers, formulas, dist)
        run: node tests/contract.test.js
      - name: Accessibility tests (jsdom + axe-core)
        run: node tests/a11y.test.js
      - name: Performance budgets (engine p95, render, bundle/precache sizes)
        run: node tests/perf.test.js
      - name: Lighthouse accessibility (real Chrome, a11y >= 0.95)
        run: npm run lighthouse
